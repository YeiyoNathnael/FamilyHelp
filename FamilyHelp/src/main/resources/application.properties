spring.application.name=FamilyHelp

spring.datasource.url=jdbc:mysql://localhost:3306/familyhelpuae?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# defaults — overridden by command line args at runtime
server.port=8080
cluster.node.host=localhost
cluster.node.port=${server.port}
